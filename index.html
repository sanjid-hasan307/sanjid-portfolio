<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sanjid Hasan Sourov — Full-Stack Developer | FinTech Engineer | AI/ML Enthusiast</title>
<meta name="description" content="Portfolio of Sanjid Hasan Sourov, CSE graduate and full-stack developer experienced in Django, Vue.js, MERN, fintech systems and machine learning.">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#050505;--fg:#ededf0;--mut:#9a9aa8;--line:rgba(255,255,255,.08);--glass:rgba(255,255,255,.04);--a:#4f7cff;--b:#8b5cf6;--grad:linear-gradient(120deg,#4f7cff,#8b5cf6);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-behavior:smooth;scroll-padding-top:calc(72px + env(safe-area-inset-top,0px))}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:radial-gradient(ellipse at 50% -10%,#0d1226,#050505 60%)}
.bg::after{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:56px 56px;mask-image:radial-gradient(ellipse at 50% 20%,#000 20%,transparent 70%);opacity:.5}
.orb{position:absolute;border-radius:50%;filter:blur(110px);opacity:.28;animation:drift 18s ease-in-out infinite alternate}
.o1{width:480px;height:480px;background:#4f7cff;top:-120px;left:-100px}
.o2{width:420px;height:420px;background:#8b5cf6;top:30%;right:-120px;animation-delay:-6s}
@keyframes drift{to{transform:translate(60px,50px) scale(1.12)}}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}
nav{position:fixed;top:0;left:0;right:0;z-index:50;padding-top:env(safe-area-inset-top,0px);background:rgba(5,5,5,.6);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;align-items:center;justify-content:space-between;height:60px}
.logo{font-weight:700;letter-spacing:-.02em}
.logo span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.links{display:flex;gap:22px;font-size:14px;color:var(--mut)}
.links a:hover{color:var(--fg)}
@media(max-width:820px){.links{display:none}}
section{padding:96px 0}
.eyebrow{font:500 12px "JetBrains Mono",monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--a);margin-bottom:10px}
h2{font-size:clamp(28px,4vw,40px);letter-spacing:-.03em;margin:0 0 14px;line-height:1.15}
.lead{color:var(--mut);max-width:640px;margin:0 0 40px}
.grad{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:18px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transition:border-color .25s,transform .25s,box-shadow .25s}
.glass:hover{border-color:rgba(120,140,255,.4);box-shadow:0 10px 50px -20px rgba(79,124,255,.5)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 20px;border-radius:12px;font-weight:600;font-size:14px;border:1px solid var(--line);background:var(--glass);transition:transform .2s,border-color .2s;cursor:pointer;color:var(--fg)}
.btn:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.25)}
.btn.p{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 8px 30px -10px rgba(99,102,241,.8)}
.chip{display:inline-block;padding:4px 10px;border-radius:999px;font:500 12px "JetBrains Mono",monospace;color:#c7cdf5;background:rgba(99,102,241,.12);border:1px solid rgba(99,102,241,.25)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.rv{opacity:0;transform:translateY(22px);transition:opacity .7s ease,transform .7s ease}
.rv.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;transition:none}.orb,.float,.node{animation:none!important}}
/* hero */
.hero{min-height:100vh;display:flex;align-items:center;padding:120px 0 70px}
.hero .wrap{display:grid;grid-template-columns:1.15fr .85fr;gap:48px;align-items:center}
@media(max-width:900px){.hero .wrap{grid-template-columns:1fr}}
.badge{display:inline-flex;gap:8px;align-items:center;font-size:13px;color:var(--mut);padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--glass);margin-bottom:22px}
.dot{width:7px;height:7px;border-radius:50%;background:#34d399;box-shadow:0 0 10px #34d399}
h1{font-size:clamp(40px,7vw,72px);letter-spacing:-.045em;line-height:1.02;margin:0 0 18px}
.role{font:500 14px "JetBrains Mono",monospace;color:var(--mut);margin-bottom:18px}
.hero p.s{font-size:18px;color:var(--mut);max-width:560px;margin:0 0 30px}
.cta{display:flex;flex-wrap:wrap;gap:12px}
.vis{position:relative;padding:28px 0}
.code{padding:20px;font:13px/1.8 "JetBrains Mono",monospace;color:#b9bfd6}
.code .k{color:#8b5cf6}.code .s{color:#7dd3fc}.code .d{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;background:#333}
.float{position:absolute;padding:8px 14px;border-radius:12px;font:500 12px "JetBrains Mono",monospace;animation:fl 6s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-12px)}}
/* stack */
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px}
.tab{padding:9px 18px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--mut);font:500 14px Inter,sans-serif;cursor:pointer;transition:.2s}
.tab.on{background:var(--grad);color:#fff;border-color:transparent}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.sk{padding:18px;display:flex;flex-direction:column;gap:10px}
.sk b{font-size:15px}
.ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font:600 13px "JetBrains Mono",monospace;background:rgba(99,102,241,.14);color:#aab4ff;border:1px solid rgba(99,102,241,.3)}
/* about */
.two{display:grid;grid-template-columns:1.3fr 1fr;gap:28px}
@media(max-width:860px){.two{grid-template-columns:1fr}}
.about p{color:var(--mut);margin:0 0 16px}
.about p b{color:var(--fg);font-weight:600}
.facts{padding:24px;display:grid;gap:18px;align-content:start}
.facts div small{display:block;color:var(--mut);font:500 11px "JetBrains Mono",monospace;text-transform:uppercase;letter-spacing:.1em}
/* timeline */
.tl{position:relative;padding-left:30px;border-left:1px solid var(--line);margin-left:6px}
.tl::before{content:"";position:absolute;left:-1px;top:0;height:60%;width:1px;background:var(--grad)}
.tli{position:relative;padding:26px;margin-bottom:22px}
.tli::before{content:"";position:absolute;left:-37px;top:32px;width:13px;height:13px;border-radius:50%;background:var(--bg);border:2px solid var(--a);box-shadow:0 0 14px var(--a)}
.tli h3{margin:0;font-size:20px;letter-spacing:-.02em}
.tli .m{color:var(--mut);font-size:14px;margin:2px 0 16px}
.tli ul{margin:0 0 18px;padding-left:18px;color:#c1c1cd}
.tli li{margin-bottom:8px}
/* projects */
.pg{display:grid;gap:24px;grid-template-columns:repeat(2,1fr)}
@media(max-width:900px){.pg{grid-template-columns:1fr}}
.pc{overflow:hidden;display:flex;flex-direction:column}
.pc:hover{transform:translateY(-4px)}
.mock{height:190px;padding:18px;background:linear-gradient(135deg,rgba(79,124,255,.18),rgba(139,92,246,.16));border-bottom:1px solid var(--line);position:relative}
.win{height:100%;border-radius:10px;border:1px solid var(--line);background:rgba(5,5,5,.7);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.win i{display:inline-block;width:7px;height:7px;border-radius:50%;background:#444;margin-right:5px}
.win .bar{height:8px;border-radius:4px;background:var(--line)}
.win .bar.a{background:var(--grad);opacity:.8}
.win .row{display:flex;gap:8px;flex:1}
.win .row div{flex:1;border-radius:6px;background:rgba(255,255,255,.05)}
.pb{padding:24px;display:flex;flex-direction:column;gap:14px;flex:1}
.pb h3{margin:0;font-size:21px;letter-spacing:-.02em}
.pb p{margin:0;color:var(--mut);font-size:15px}
.pb ul{margin:0;padding-left:18px;color:#c1c1cd;font-size:14px}
.pb .btn{align-self:flex-start;margin-top:auto}
/* ml */
.ml{border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgba(79,124,255,.05),rgba(139,92,246,.05))}
.mlg{display:grid;grid-template-columns:1fr 1fr;gap:36px;align-items:center}
@media(max-width:860px){.mlg{grid-template-columns:1fr}}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:22px 0}
.stat{padding:18px}
.stat b{display:block;font-size:26px;letter-spacing:-.03em}
.stat span{font-size:13px;color:var(--mut)}
.node{animation:pu 3s ease-in-out infinite}
@keyframes pu{50%{opacity:.35}}
/* contact */
.ct{padding:44px;text-align:center}
.ct h2{margin-bottom:12px}
.ct .cta{justify-content:center;margin-top:24px}
footer{padding:30px 0;text-align:center;color:var(--mut);font-size:13px;border-top:1px solid var(--line)}
.photo{max-width:340px;margin:0 auto;padding:8px;position:relative;overflow:hidden}
.photo img{display:block;width:100%;height:auto;border-radius:12px;aspect-ratio:3/4;object-fit:cover}
.photo .cap{position:absolute;left:8px;right:8px;bottom:8px;padding:14px 16px;border-radius:0 0 12px 12px;background:linear-gradient(transparent,rgba(5,5,5,.88));display:flex;flex-direction:column;font-size:13px;color:var(--mut)}
.photo .cap b{color:var(--fg);font-size:15px}
</style>
</head>
